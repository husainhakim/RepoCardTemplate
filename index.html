<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Card Generator</title>
<style>
  :root{
    --bg:#0d0e13; --panel:#161822; --line:#22242e; --text:#d7d9e0;
    --muted:#6b6f7d; --green:#3ddc84; --amber:#f5a623; --blue:#6ea8fe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#08090c; color:var(--text);
    font-family:'Consolas','Courier New',monospace;
    display:flex; flex-wrap:wrap; gap:28px; padding:28px; justify-content:center;
  }
  h1{font-size:16px; color:#f2f3f5; letter-spacing:.5px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:12px; margin:0 0 20px;}
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:22px; width:420px; flex-shrink:0;
  }
  label{display:block; font-size:11px; color:var(--green); letter-spacing:1px; margin:14px 0 6px; text-transform:uppercase;}
  label:first-of-type{margin-top:0;}
  input, textarea{
    width:100%; background:#0d0e13; border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:13px; padding:9px 10px; border-radius:5px; resize:vertical;
  }
  input::placeholder, textarea::placeholder{color:#4a4d59;}
  input:focus, textarea:focus{outline:none; border-color:var(--green);}
  .row3{display:flex; gap:8px;}
  .row3 > div{flex:1;}
  .hint{color:var(--muted); font-size:10.5px; margin-top:4px;}
  button{
    margin-top:20px; width:100%; background:var(--green); color:#0d0e13; border:none;
    font-family:inherit; font-weight:700; font-size:13px; letter-spacing:.5px;
    padding:12px; border-radius:6px; cursor:pointer;
  }
  button:hover{background:#33c473;}
  .preview-wrap{display:flex; flex-direction:column; align-items:center; gap:14px;}
  #cardHost{width:700px; max-width:90vw;}
  #cardHost svg{width:100%; height:auto; display:block; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
</style>
</head>
<body>

  <div class="panel">
    <h1>&gt; project_card --init</h1>
    <p class="sub"># fill in your project details, preview updates live</p>

    <label>Command / prompt line</label>
    <input id="command" placeholder="./repochecker --audit">
    <div class="hint">Shown after "$ " at the top of the card, e.g. ./identify --project</div>

    <label>Project name</label>
    <input id="title" placeholder="File Signature Identifier" maxlength="40">

    <label>One-line tagline (shown after the # comment)</label>
    <input id="tagline" placeholder="true file-type detection via magic numbers, not extensions" maxlength="90">

    <label>Problem</label>
    <textarea id="problem" rows="2" maxlength="100" placeholder="extensions lie; malware masquerades as trusted file types"></textarea>

    <label>Method</label>
    <textarea id="method" rows="2" maxlength="100" placeholder="reads raw binary headers, flags mismatches, renders hex dump"></textarea>

    <label>Stack</label>
    <input id="stack" placeholder="React / Vite frontend · Python FastAPI backend" maxlength="90">

    <label>Status</label>
    <input id="status" placeholder="completed · 2024" maxlength="40">

    <label>Tags (up to 3, comma-separated)</label>
    <input id="tags" placeholder="MAGIC NUMBERS, SPOOF DETECTION, HEX VIEWER" maxlength="80">
    <div class="hint">Each tag renders as a colored pill: green, amber, blue in order.</div>

    <label>Terminal window title</label>
    <input id="wintitle" placeholder="forensics-lab — file-signature-identifier — bash" maxlength="70">

    <button id="downloadBtn">Download SVG</button>
  </div>

  <div class="preview-wrap">
    <div id="cardHost"></div>
  </div>

<script>
function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

const tagColors = ['#3ddc84', '#f5a623', '#6ea8fe'];

function buildSVG(d){
  const tags = d.tags.split(',').map(t=>t.trim()).filter(Boolean).slice(0,3);
  let tagX = 48, tagsSVG = '';
  tags.forEach((t, i) => {
    const w = Math.max(110, t.length * 10.5 + 28);
    tagsSVG += `
    <rect x="${tagX}" y="0" width="${w}" height="32" rx="5" fill="${tagColors[i]}"/>
    <text x="${tagX + w/2}" y="21" text-anchor="middle" class="tag">${esc(t)}</text>`;
    tagX += w + 14;
  });

  return `<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .win-title { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; fill: #6b6f7d; letter-spacing: 1px; }
      .prompt { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #3ddc84; }
      .heading { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 42px; fill: #f2f3f5; }
      .comment { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #6b6f7d; }
      .field-key { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; font-size: 25px; fill: #3ddc84; }
      .field-val { font-family: 'Consolas', 'Courier New', monospace; font-size: 25px; fill: #d7d9e0; }
      .hex { font-family: 'Consolas', 'Courier New', monospace; font-size: 22px; fill: #3a3d4a; }
      .tag { font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; fill: #0d0e13; font-weight:700;}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="10" fill="#0d0e13"/>
  <rect x="1" y="1" width="1198" height="458" rx="9" fill="none" stroke="#22242e" stroke-width="1.5"/>

  <text x="640" y="64" class="hex" text-anchor="middle">25 50 44 46 2D 31 2E 34 0A 89 50 4E 47 0D 0A 1A 0A 50 4B 03 04 14 00</text>
  <text x="640" y="440" class="hex" text-anchor="middle">7F 45 4C 46 02 01 01 00 00 00 4D 5A 90 00 03 00 00 00 04 00 00 00</text>

  <rect x="0" y="0" width="1200" height="42" rx="10" fill="#161822"/>
  <rect x="0" y="30" width="1200" height="12" fill="#161822"/>
  <circle cx="28" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="72" cy="21" r="7" fill="#27c93f"/>
  <text x="600" y="27" text-anchor="middle" class="win-title">${esc(d.wintitle)}</text>

  <text x="48" y="100" class="prompt">$ ${esc(d.command)}</text>
  <text x="48" y="152" class="heading">${esc(d.title)}</text>
  <text x="48" y="184" class="comment"># ${esc(d.tagline)}</text>

  <line x1="48" y1="206" x2="1152" y2="206" stroke="#22242e" stroke-width="1.5"/>

  <text x="48" y="246" class="field-key">problem   →</text>
  <text x="220" y="246" class="field-val">${esc(d.problem)}</text>

  <text x="48" y="288" class="field-key">method    →</text>
  <text x="220" y="288" class="field-val">${esc(d.method)}</text>

  <text x="48" y="330" class="field-key">stack     →</text>
  <text x="220" y="330" class="field-val">${esc(d.stack)}</text>

  <text x="48" y="372" class="field-key">status    →</text>
  <text x="220" y="372" class="field-val" fill="#3ddc84">${esc(d.status)}</text>
  <rect x="1080" y="355" width="20" height="20" fill="#3ddc84" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(0, 404)">${tagsSVG}</g>
</svg>`;
}

function readForm(){
  const val = (id, fallback) => document.getElementById(id).value || fallback;
  return {
    command: val('command', './identify --project'),
    title: val('title', 'Project Name'),
    tagline: val('tagline', 'a one-line description of what this project does'),
    problem: val('problem', 'the problem this project solves'),
    method: val('method', 'how it solves that problem'),
    stack: val('stack', 'tech stack goes here'),
    status: val('status', 'in progress'),
    tags: val('tags', 'TAG ONE, TAG TWO, TAG THREE'),
    wintitle: val('wintitle', 'project — repo-name — bash'),
  };
}

function render(){
  const svg = buildSVG(readForm());
  document.getElementById('cardHost').innerHTML = svg;
}

['command','title','tagline','problem','method','stack','status','tags','wintitle'].forEach(id=>{
  document.getElementById(id).addEventListener('input', render);
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const svg = buildSVG(readForm());
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const name = (document.getElementById('title').value || 'project-card').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  a.href = url;
  a.download = (name || 'project-card') + '.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

render();
</script>
</body>
</html>
